<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zenith Live Canvas Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="badge">LIVE PREVIEW</div>
      <h1>Welcome to Zenith Studio</h1>
      <p>Edit this file or <code>styles.css</code> in Zenith IDE and see changes live!</p>
      <div class="stats">
        <div class="stat-box">
          <span class="num" id="particle-count">100</span>
          <span class="label">Interactive Particles</span>
        </div>
        <div class="stat-box">
          <span class="num" id="fps-counter">60</span>
          <span class="label">FPS Target</span>
        </div>
      </div>
      <button id="color-btn" onclick="randomizeColors()">Randomize Colors 🎨</button>
    </div>
  </div>

  <canvas id="bg-canvas"></canvas>

  <script>
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    let hue = 220;
    const particles = [];
    const count = 80;

    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 1.5,
        vy: (Math.random() - 0.5) * 1.5,
        radius: Math.random() * 3 + 1
      });
    }

    function randomizeColors() {
      hue = Math.floor(Math.random() * 360);
      document.documentElement.style.setProperty('--primary', `hsl(${hue}, 80%, 60%)`);
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      // Connect particles
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 120) {
            ctx.strokeStyle = `hsla(${hue}, 70%, 60%, ${1 - dist / 120})`;
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      }

      // Draw points
      for (const p of particles) {
        ctx.fillStyle = `hsl(${hue}, 80%, 70%)`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();

        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0 || p.x > width) p.vx *= -1;
        if (p.y < 0 || p.y > height) p.vy *= -1;
      }

      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
